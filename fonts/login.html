<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic HTML Settings -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Meeting Scheduler</title>
    <style>
        /* ========================================
   LOGIN SECTION
======================================== */

.login-section {
    min-height: calc(100vh - 130px);

    display: flex;
    align-items: center;

    padding: 60px 0;

    background: linear-gradient(
        135deg,
        #eef4ff,
        #ffffff
    );
}


/* ========================================
   LOGIN CARD
======================================== */

.login-card {
    border: none;
    border-radius: 18px;

    overflow: hidden;

    background-color: #ffffff;

    transition: 0.3s;
}


.login-card:hover {
    transform: translateY(-5px);
}


/* ========================================
   LOGIN TITLE
======================================== */

.login-title {
    font-size: 32px;
    font-weight: 700;

    color: #111827;
}


/* ========================================
   FORM LABEL
======================================== */

.form-label {
    font-weight: 600;
    color: #374151;
}


/* ========================================
   INPUT
======================================== */

.form-control {
    padding: 12px 15px;

    border-radius: 8px;

    border: 1px solid #d1d5db;
}


.form-control:focus {
    border-color: #0d6efd;

    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
}


/* ========================================
   LOGIN BUTTON
======================================== */

.login-btn {
    padding: 12px;

    font-size: 16px;

    font-weight: 600;

    border-radius: 8px;

    transition: 0.3s;
}


.login-btn:hover {
    transform: translateY(-2px);
}


/* ========================================
   REGISTER LINK
======================================== */

.register-link {
    text-decoration: none;

    font-weight: 600;
}


.register-link:hover {
    text-decoration: underline;
}


/* ========================================
   ERROR MESSAGE
======================================== */

#errorMessage {
    font-size: 14px;
}


/* ========================================
   MOBILE
======================================== */

@media (max-width: 576px) {

    .login-section {
        padding: 40px 15px;
    }

    .login-title {
        font-size: 27px;
    }

}
    </style>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Common CSS -->
    
    <!-- Login Page CSS -->
    <link rel="stylesheet" href="css/login.css">

</head>


<body>


    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Website Name -->

            <a class="navbar-brand fw-bold"
               href="index.html">

                Meeting Scheduler

            </a>


            <!-- Mobile Menu Button -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation Links -->

            <div class="collapse navbar-collapse"
                 id="navbarMenu">

                <div class="ms-auto">

                    <a href="index.html"
                       class="btn btn-outline-light me-2">

                        Home

                    </a>

                    <a href="register.html"
                       class="btn btn-primary">

                        Register

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <main>

        <section class="login-section">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-md-6 col-lg-5">


                        <!-- Login Card -->

                        <div class="card login-card shadow">


                            <div class="card-body p-4 p-md-5">


                                <!-- Heading -->

                                <div class="text-center mb-4">

                                    <h1 class="login-title">

                                        Welcome Back

                                    </h1>

                                    <p class="text-muted">

                                        Login to your Meeting Scheduler account.

                                    </p>

                                </div>



                                <!-- Login Form -->

                                <form id="loginForm"
                                    action="/login"
                                    method="POST">


                                    <!-- Email -->

                                    <div class="mb-3">

                                        <label
                                            for="email"
                                            class="form-label">

                                            Email Address

                                        </label>


                                        <input
                                            type="email"
                                            id="email"
                                            name="email"
                                            class="form-control"
                                            placeholder="Enter your email"
                                            required>

                                    </div>



                                    <!-- Password -->

                                    <div class="mb-3">

                                        <label
                                            for="password"
                                            class="form-label">

                                            Password

                                        </label>


                                        <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            class="form-control"
                                            placeholder="Enter your password"
                                            required>

                                    </div>



                                    <!-- Remember Me -->

                                    <div class="form-check mb-3">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="rememberMe">

                                        <label
                                            class="form-check-label"
                                            for="rememberMe">

                                            Remember me

                                        </label>

                                    </div>



                                    <!-- Error Message -->

                                    <div
                                        id="errorMessage"
                                        class="alert alert-danger d-none">

                                    </div>



                                    <!-- Login Button -->

                                    <button
                                        type="submit"
                                        class="btn btn-primary w-100 login-btn">

                                        Login

                                    </button>


                                </form>



                                <!-- Register Link -->

                                <div class="text-center mt-4">

                                    <p class="mb-0">

                                        Don't have an account?

                                        <a
                                            href="register.html"
                                            class="register-link">

                                            Create an account

                                        </a>

                                    </p>

                                </div>


                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">

            © 2026 Meeting Scheduler

        </p>

    </footer>



    <!-- =========================
         BOOTSTRAP JAVASCRIPT
    ========================== -->

   

    <!-- LOGIN JAVASCRIPT -->

    <script>
           const loginForm =
    document.getElementById("loginForm");

const errorMessage =
    document.getElementById("errorMessage");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    errorMessage.classList.add("d-none");
    errorMessage.textContent = "";


    if (email === "") {

        showError("Please enter your email.");

        return;
    }


    if (password === "") {

        showError("Please enter your password.");

        return;
    }


    try {

        const response = await fetch("/auth/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                email: email,
                password: password

            })

        });


        const data =await response.json();


        if (response.ok) {

            // Save logged-in user
            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );
              alert("Login successful!");


            // Go to dashboard
            window.location.href =
                "dashboard.html";

        }

        else {

            showError(
                data.message ||
                "Login failed."
            );

        }

    }

    catch (error) {

        console.error(error);

        showError(
            "Unable to connect to the server."
        );

    }

});


function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.classList.remove(
        "d-none"
    );

}

</script>

</body>

</html>
