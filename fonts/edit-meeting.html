<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Meeting - Meeting Scheduler</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Common CSS -->
    <link rel="stylesheet" href="css/style.css">


    <!-- Edit Meeting CSS -->
    <link rel="stylesheet" href="css/edit-meeting.css">


    <style>

        .edit-meeting-section {

            min-height: calc(100vh - 130px);

            display: flex;

            align-items: center;

            padding: 60px 0;

            background: linear-gradient(
                135deg,
                #eef4ff,
                #ffffff
            );

        }


        .edit-meeting-card {

            border: none;

            border-radius: 18px;

            background-color: #ffffff;

            transition: 0.3s;

        }


        .edit-meeting-card:hover {

            transform: translateY(-5px);

        }


        .edit-title {

            font-size: 32px;

            font-weight: 700;

            color: #111827;

        }


        .form-label {

            font-weight: 600;

            color: #374151;

        }


        .form-control {

            padding: 12px 15px;

            border-radius: 8px;

            border: 1px solid #d1d5db;

        }


        .form-control:focus {

            border-color: #0d6efd;

            box-shadow:
                0 0 0 0.2rem
                rgba(13, 110, 253, 0.15);

        }


        textarea.form-control {

            resize: vertical;

            min-height: 120px;

        }


        .btn {

            border-radius: 8px;

            font-weight: 600;

        }


        .btn-primary {

            padding: 12px 20px;

        }


        #errorMessage,
        #successMessage {

            font-size: 14px;

        }


        @media (max-width: 576px) {

            .edit-meeting-section {

                padding: 40px 15px;

            }


            .edit-title {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         NAVIGATION BAR
    ========================================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="dashboard.html">

                Meeting Scheduler

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <div class="ms-auto">

                    <a
                        href="dashboard.html"
                        class="btn btn-outline-light me-2">

                        Dashboard

                    </a>


                    <a
                        href="view-meetings.html"
                        class="btn btn-primary">

                        My Meetings

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- ========================================
         MAIN SECTION
    ========================================= -->

    <main>

        <section class="edit-meeting-section">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-md-8 col-lg-7">


                        <div
                            class="card edit-meeting-card shadow">


                            <div
                                class="card-body p-4 p-md-5">


                                <!-- ========================================
                                     TITLE
                                ========================================= -->

                                <div
                                    class="text-center mb-4">

                                    <h1 class="edit-title">

                                        Edit Meeting

                                    </h1>


                                    <p class="text-muted">

                                        Update your meeting details.

                                    </p>

                                </div>



                                <!-- ========================================
                                     FORM
                                ========================================= -->

                                <form
                                    id="editMeetingForm">


                                    <!-- Hidden Meeting ID -->

                                    <input
                                        type="hidden"
                                        id="meeting_id"
                                        name="meeting_id">



                                    <!-- ========================================
                                         MEETING TITLE
                                    ========================================= -->

                                    <div class="mb-3">

                                        <label
                                            for="title"
                                            class="form-label">

                                            Meeting Title

                                        </label>


                                        <input
                                            type="text"
                                            id="title"
                                            name="title"
                                            class="form-control"
                                            placeholder="Enter meeting title"
                                            required>

                                    </div>



                                    <!-- ========================================
                                         DATE AND TIME
                                    ========================================= -->

                                    <div class="row">


                                        <!-- DATE -->

                                        <div
                                            class="col-md-6 mb-3">

                                            <label
                                                for="meeting_date"
                                                class="form-label">

                                                Meeting Date

                                            </label>


                                            <input
                                                type="date"
                                                id="meeting_date"
                                                name="meeting_date"
                                                class="form-control"
                                                required>

                                        </div>



                                        <!-- TIME -->

                                        <div
                                            class="col-md-6 mb-3">

                                            <label
                                                for="meeting_time"
                                                class="form-label">

                                                Meeting Time

                                            </label>


                                            <input
                                                type="time"
                                                id="meeting_time"
                                                name="meeting_time"
                                                class="form-control"
                                                required>

                                        </div>

                                    </div>



                                    <!-- ========================================
                                         DESCRIPTION
                                    ========================================= -->

                                    <div class="mb-3">

                                        <label
                                            for="description"
                                            class="form-label">

                                            Description

                                        </label>


                                        <textarea
                                            id="description"
                                            name="description"
                                            class="form-control"
                                            rows="5"
                                            placeholder="Enter meeting details..."
                                            required></textarea>

                                    </div>



                                    <!-- ========================================
                                         LOCATION
                                    ========================================= -->

                                    <div class="mb-3">

                                        <label
                                            for="location"
                                            class="form-label">

                                            Location

                                        </label>


                                        <input
                                            type="text"
                                            id="location"
                                            name="location"
                                            class="form-control"
                                            placeholder="Enter meeting location"
                                            required>

                                    </div>



                                    <!-- ========================================
                                         ERROR MESSAGE
                                    ========================================= -->

                                    <div
                                        id="errorMessage"
                                        class="alert alert-danger d-none">

                                    </div>



                                    <!-- ========================================
                                         SUCCESS MESSAGE
                                    ========================================= -->

                                    <div
                                        id="successMessage"
                                        class="alert alert-success d-none">

                                    </div>



                                    <!-- ========================================
                                         BUTTONS
                                    ========================================= -->

                                    <div
                                        class="d-flex gap-2 mt-4">


                                        <button
                                            type="submit"
                                            id="saveButton"
                                            class="btn btn-primary flex-grow-1">

                                            Save Changes

                                        </button>


                                        <a
                                            href="view-meetings.html"
                                            class="btn btn-secondary">

                                            Cancel

                                        </a>

                                    </div>


                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer
        class="bg-dark text-white text-center py-3">

        <p class="mb-0">

            © 2026 Meeting Scheduler

        </p>

    </footer>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- ========================================
         EDIT MEETING JAVASCRIPT
    ========================================= -->

    <script>

        // ========================================
        // GET HTML ELEMENTS
        // ========================================

        const editMeetingForm =
            document.getElementById(
                "editMeetingForm"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        const saveButton =
            document.getElementById(
                "saveButton"
            );



        // ========================================
        // GET MEETING ID FROM URL
        // ========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const meetingId =
            urlParams.get("id");


        console.log(
            "Meeting ID:",
            meetingId
        );


        // Put ID into hidden input

        if (meetingId) {

            document.getElementById(
                "meeting_id"
            ).value = meetingId;

        }



        // ========================================
        // LOAD MEETING DETAILS
        // ========================================

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                if (!meetingId) {

                    showError(
                        "Meeting ID is missing."
                    );

                    return;

                }


                // Get logged-in user

                const storedUser =
                    localStorage.getItem(
                        "user"
                    );


                console.log(
                    "Stored user:",
                    storedUser
                );


                if (!storedUser) {

                    showError(
                        "Please login first."
                    );

                    return;

                }


                try {

                    const user =
                        JSON.parse(
                            storedUser
                        );


                    const userId =
                        user.id ||
                        user._id;


                    console.log(
                        "User ID:",
                        userId
                    );


                    if (!userId) {

                        showError(
                            "User ID not found."
                        );

                        return;

                    }


                    // ========================================
                    // GET USER MEETINGS
                    // ========================================

                    const response =
                        await fetch(
                            `/meetings/${userId}`
                        );


                    console.log(
                        "GET status:",
                        response.status
                    );


                    const data =
                        await response.json();


                    console.log(
                        "Meetings:",
                        data
                    );


                    if (!response.ok) {

                        showError(
                            data.message ||
                            "Failed to load meeting."
                        );

                        return;

                    }


                    // Find selected meeting

                    const meeting =
                        data.find(
                            function (item) {

                                return (
                                    String(item._id) ===
                                    String(meetingId)
                                );

                            }
                        );


                    if (!meeting) {

                        showError(
                            "Meeting not found."
                        );

                        return;

                    }


                    console.log(
                        "Selected meeting:",
                        meeting
                    );


                    // ========================================
                    // FILL FORM
                    // ========================================

                    document.getElementById(
                        "title"
                    ).value =
                        meeting.title || "";


                    document.getElementById(
                        "meeting_date"
                    ).value =
                        meeting.meetingDate || "";


                    document.getElementById(
                        "meeting_time"
                    ).value =
                        meeting.meetingTime || "";


                    document.getElementById(
                        "description"
                    ).value =
                        meeting.description || "";


                    document.getElementById(
                        "location"
                    ).value =
                        meeting.location || "";


                }

                catch (error) {

                    console.error(
                        "Load meeting error:",
                        error
                    );


                    showError(
                        "Unable to connect to the server."
                    );

                }

            }
        );



        // ========================================
        // UPDATE MEETING
        // ========================================

        editMeetingForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // ========================================
                // GET FORM VALUES
                // ========================================

                const title =
                    document.getElementById(
                        "title"
                    ).value.trim();


                const meetingDate =
                    document.getElementById(
                        "meeting_date"
                    ).value;


                const meetingTime =
                    document.getElementById(
                        "meeting_time"
                    ).value;


                const description =
                    document.getElementById(
                        "description"
                    ).value.trim();


                const location =
                    document.getElementById(
                        "location"
                    ).value.trim();



                // ========================================
                // CLEAR MESSAGES
                // ========================================

                errorMessage.classList.add(
                    "d-none"
                );


                successMessage.classList.add(
                    "d-none"
                );



                // ========================================
                // VALIDATION
                // ========================================

                if (!meetingId) {

                    showError(
                        "Meeting ID is missing."
                    );

                    return;

                }


                if (
                    title === "" ||
                    title.length < 3
                ) {

                    showError(
                        "Please enter a valid title."
                    );

                    return;

                }


                if (!meetingDate) {

                    showError(
                        "Please select a meeting date."
                    );

                    return;

                }


                if (!meetingTime) {

                    showError(
                        "Please select a meeting time."
                    );

                    return;

                }


                if (!description) {

                    showError(
                        "Please enter the description."
                    );

                    return;

                }


                if (!location) {

                    showError(
                        "Please enter the location."
                    );

                    return;

                }



                // ========================================
                // DISABLE BUTTON
                // ========================================

                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";



                // ========================================
                // SEND PUT REQUEST
                // ========================================

                try {

                    const response =
                        await fetch(
                            `/meetings/${meetingId}`,
                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        title:
                                            title,

                                        meetingDate:
                                            meetingDate,

                                        meetingTime:
                                            meetingTime,

                                        description:
                                            description,

                                        location:
                                            location

                                    })

                            }
                        );


                    console.log(
                        "PUT status:",
                        response.status
                    );


                    const data =
                        await response.json();


                    console.log(
                        "PUT response:",
                        data
                    );


                    // ========================================
                    // CHECK RESPONSE
                    // ========================================

                    if (!response.ok) {

                        showError(
                            data.message ||
                            "Failed to update meeting."
                        );


                        saveButton.disabled =
                            false;


                        saveButton.textContent =
                            "Save Changes";


                        return;

                    }



                    // ========================================
                    // SUCCESS
                    // ========================================

                    alert(
                        "Meeting updated successfully!"
                    );


                    // Go back to view meetings

                    window.location.href =
                        "view-meetings.html";


                }

                catch (error) {

                    console.error(
                        "Update meeting error:",
                        error
                    );


                    showError(
                        "Unable to connect to the server."
                    );


                    saveButton.disabled =
                        false;


                    saveButton.textContent =
                        "Save Changes";

                }

            }
        );



        // ========================================
        // SHOW ERROR
        // ========================================

        function showError(message) {

            errorMessage.textContent =
                message;


            errorMessage.classList.remove(
                "d-none"
            );

        }


        // ========================================
        // SHOW SUCCESS
        // ========================================

        function showSuccess(message) {

            successMessage.textContent =
                message;


            successMessage.classList.remove(
                "d-none"
            );

        }

    </script>


</body>

</html>
